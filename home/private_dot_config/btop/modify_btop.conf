#!/bin/sh
# btop rewrites its whole config on exit, so only enforce the keys we care about
# and leave everything else as btop wrote it.
awk '
BEGIN {
  want["color_theme"] = "\"TTY\""
  want["theme_background"] = "False"
}
{
  key = $1
  if (key in want && $2 == "=") {
    print key " = " want[key]
    seen[key] = 1
    next
  }
  print
}
END {
  for (k in want) if (!(k in seen)) print k " = " want[k]
}
'
